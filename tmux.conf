# ==============================================================================
#  tmux.conf — zero-plugin, đa nền tảng (macOS / Linux / WSL / MSYS2)
#  https://github.com/Gin111191/tmux-config
#
#  Dựa trên tonybanters/tmux-btw, đã chỉnh sửa:
#    - Giữ prefix mặc định Ctrl+b
#    - Biến màu dùng %hidden (không rò rỉ ra môi trường shell)
#    - Đường dẫn trên thanh status dùng regex native (không sinh tiến trình)
#    - Tự nhận diện lệnh clipboard theo hệ điều hành
#    - Không hardcode đường dẫn config
#
#  KHÔNG cần TPM, không cần plugin, không cần Python.
# ==============================================================================


# ------------------------------------------------------------------------------
# Terminal & màu sắc
# ------------------------------------------------------------------------------
# tmux-256color tốt hơn screen-256color: hỗ trợ chữ nghiêng, undercurl.
# Nếu terminal của bạn báo lỗi "missing or unsuitable terminal", đổi về
# "screen-256color" hoặc chạy: /usr/bin/tic -x terminfo/tmux-256color.src
set  -g default-terminal "tmux-256color"
set  -ga terminal-overrides ",*:RGB"          # true color 24-bit


# ------------------------------------------------------------------------------
# Cơ bản
# ------------------------------------------------------------------------------
set  -g mouse on                # bật chuột: click chọn pane, kéo viền resize
set  -g set-clipboard on        # copy ra clipboard hệ thống qua OSC 52
set  -g escape-time 0           # bỏ trễ phím ESC (quan trọng cho Neovim)
set  -g history-limit 100000    # số dòng cuộn lại được (mặc định chỉ 2000)
set  -g focus-events on         # để Neovim tự nạp lại file khi đổi bên ngoài
set  -g allow-passthrough on    # cho phép xem ảnh trong terminal (yazi, image.nvim)
set  -g detach-on-destroy off   # đóng session cuối thì nhảy sang session khác
set  -g set-titles on           # đặt tiêu đề cửa sổ terminal

# Đánh số cửa sổ/pane từ 1 thay vì 0 (phím số 1 nằm ngoài cùng bên trái)
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on     # đánh số lại khi đóng một cửa sổ, không để trống

# KHÔNG đặt default-shell — tmux tự dùng $SHELL của bạn.
# Đặt cứng /bin/zsh sẽ hỏng trên máy có zsh ở /usr/bin/zsh.


# ------------------------------------------------------------------------------
# Prefix — GIỮ MẶC ĐỊNH Ctrl+b
# ------------------------------------------------------------------------------
# Không đổi sang Ctrl+a vì Ctrl+a là phím "về đầu dòng" của shell.
# Muốn đổi thì bỏ chú thích 3 dòng dưới:
#   unbind C-b
#   set -g prefix C-a
#   bind -N "Gửi Ctrl+a thật" C-a send-prefix


# ------------------------------------------------------------------------------
# Chia pane / cửa sổ mới — luôn giữ nguyên thư mục hiện tại
# ------------------------------------------------------------------------------
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"


# ------------------------------------------------------------------------------
# Di chuyển giữa các pane
# ------------------------------------------------------------------------------
# Kiểu vim, có prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Kiểu vim, KHÔNG cần prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Phím mũi tên, không cần prefix
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R


# ------------------------------------------------------------------------------
# Đổi kích thước pane  (chữ HOA, -r = giữ prefix bấm nhiều lần)
# ------------------------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h resize-pane -L 1
bind -r C-j resize-pane -D 1
bind -r C-k resize-pane -U 1
bind -r C-l resize-pane -R 1

# Phóng to / thu nhỏ pane
bind -r m resize-pane -Z


# ------------------------------------------------------------------------------
# Chuyển cửa sổ
# ------------------------------------------------------------------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left  previous-window
bind -n S-Right next-window

# Đổi vị trí cửa sổ hiện tại sang trái/phải
bind -r C-S-Left  swap-window -d -t -1
bind -r C-S-Right swap-window -d -t +1


# ------------------------------------------------------------------------------
# Nạp lại config
# ------------------------------------------------------------------------------
# Không hardcode đường dẫn: thử ~/.config/tmux/tmux.conf trước, rồi ~/.tmux.conf
unbind r
bind r if-shell '[ -f "$HOME/.config/tmux/tmux.conf" ]' \
    'source-file "$HOME/.config/tmux/tmux.conf" ; display "Đã nạp lại config"' \
    'source-file "$HOME/.tmux.conf" ; display "Đã nạp lại config"'


# ------------------------------------------------------------------------------
# Copy mode kiểu vim
# ------------------------------------------------------------------------------
# Vào copy mode: Prefix + [    Thoát: q
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle      # bôi khối chữ nhật
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# Thả chuột KHÔNG thoát copy mode (mặc định tmux thoát ngay, mất vùng vừa bôi)
unbind -T copy-mode-vi MouseDragEnd1Pane

# Dán
bind P paste-buffer


# ------------------------------------------------------------------------------
# Clipboard — tự nhận diện theo hệ điều hành
# ------------------------------------------------------------------------------
# Mặc định là OSC 52 (dòng `set -g set-clipboard on` ở trên) — chạy trên mọi
# hệ điều hành và qua cả SSH, miễn là terminal hỗ trợ (WezTerm, kitty, iTerm2,
# Alacritty, Ghostty, Windows Terminal đều hỗ trợ).
#
# Bên dưới ghi đè bằng lệnh clipboard native nếu máy có sẵn.
# Thứ tự quan trọng: dòng sau ghi đè dòng trước, nên xếp từ ưu tiên thấp đến cao.

# Linux — X11
if-shell 'command -v xclip >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# Linux — Wayland (ưu tiên hơn X11)
if-shell 'command -v wl-copy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'

# macOS
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'

# WSL — ưu tiên cao nhất, đẩy thẳng sang clipboard của Windows
if-shell 'command -v clip.exe >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"'


# ------------------------------------------------------------------------------
# Giao diện — Tokyo Night Moon
# ------------------------------------------------------------------------------
# %hidden = biến chỉ tmux dùng, KHÔNG rò rỉ vào môi trường shell.
# (Bỏ %hidden đi thì cả 13 biến này sẽ xuất hiện trong `env` của mọi shell.)
# Muốn đổi màu: chỉ cần sửa 13 dòng dưới đây.
%hidden thm_bg="#222436"
%hidden thm_fg="#c8d3f5"
%hidden thm_black="#1b1d2b"
%hidden thm_black4="#444a73"
%hidden thm_gray="#3a3f5a"
%hidden thm_red="#ff757f"
%hidden thm_pink="#ff757f"
%hidden thm_green="#c3e88d"
%hidden thm_yellow="#ffc777"
%hidden thm_orange="#ff9e64"
%hidden thm_blue="#82aaff"
%hidden thm_magenta="#c099ff"
%hidden thm_cyan="#86e1fc"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=${thm_fg},bg=${thm_bg}"

# Thông báo
set -g message-style         "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Viền pane
set -g pane-border-style        "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Copy mode / đồng hồ
set -g mode-style        "fg=${thm_blue},bg=${thm_black4},bold"
set -g clock-mode-colour "${thm_blue}"

set -g window-status-separator ""
set -g window-status-style          "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"

# Cửa sổ ĐANG MỞ: số thứ tự + dấu tick + 2 cấp thư mục cuối
#
#   #I  = số thứ tự cửa sổ
#   #{s|...|...|:pane_current_path}  = cắt lấy 2 cấp thư mục cuối bằng regex
#
#   Ví dụ:  /home/ban/repos/du-an/backend/src  ->  backend/src
#
#   LƯU Ý: phải viết \\1 (HAI gạch chéo). Viết \1 một gạch thì tmux hiểu
#   là escape bát phân và báo lỗi "invalid octal escape".
#
#   Đây là cách NATIVE của tmux, khác bản gốc dùng shell:
#     #(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev)
#   Bản shell sinh 3 tiến trình mỗi lần vẽ status, và VỠ nếu tên thư mục
#   chứa dấu nháy đơn ('). Bản regex này không có cả hai vấn đề đó.
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_magenta}](✓) #[fg=${thm_cyan}]#{s|^.*/([^/]+/[^/]+)$|\\1|:pane_current_path} "

# Các cửa sổ KHÁC: số thứ tự + tên chương trình
set -g window-status-format " #I: #W"

# Bên trái: để trống
set -g status-left ""

# Bên phải: tên cửa sổ | chỉ báo prefix | tên session
# #{?client_prefix,A,B} = nếu đang bấm prefix thì hiện A, không thì B
# -> ô giữa đổi sang màu tím khi bạn vừa bấm Ctrl+b
set -g status-right "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_fg},bg=${thm_gray}]  #W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}]  #[fg=${thm_fg},bg=${thm_gray}] #S "
