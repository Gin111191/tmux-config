# ==============================================================================
#  tmux.conf — zero-plugin, cross-platform (macOS / Linux / WSL / MSYS2)
#  https://github.com/Gin111191/tmux-config
#
#  Based on tonybanters/tmux-btw, with these changes:
#    - Keeps the default Ctrl+b prefix
#    - Colour variables use %hidden (no leaking into the shell environment)
#    - The status-bar path uses a native regex (no processes spawned)
#    - The clipboard command is detected per operating system
#    - No hard-coded config path
#
#  No TPM needed, no plugins, no Python.
# ==============================================================================


# ------------------------------------------------------------------------------
# Terminal & colours
# ------------------------------------------------------------------------------
# tmux-256color beats screen-256color: it supports italics and undercurl.
# If your terminal reports "missing or unsuitable terminal", switch back to
# "screen-256color" or run: /usr/bin/tic -x terminfo/tmux-256color.src
set  -g default-terminal "tmux-256color"
# No blanket "*:RGB" here. tmux works out 24-bit colour per attached client
# (measured: COLORTERM=truecolor -> RGB in client_termfeatures, without it -> no
# RGB). Forcing "*" told tmux that Terminal.app does 24-bit too, so Neovim sent it
# colour codes it cannot read and the screen went one colour.

# Carry COLORTERM in from whichever terminal is attaching, so a pane opened
# after reattaching from a 256-colour terminal (Terminal.app) sees it gone
# and Neovim drops to its 256-colour palette. Panes that already exist keep
# the old value -- open a new one to get the new setting.
set  -ga update-environment "COLORTERM"


# ------------------------------------------------------------------------------
# Basics
# ------------------------------------------------------------------------------
set  -g mouse on                # mouse on: click to pick a pane, drag a border to resize
set  -g set-clipboard on        # copy to the system clipboard over OSC 52
set  -g escape-time 0           # drop the ESC key delay (important for Neovim)
set  -g history-limit 100000    # scrollback lines (the default is only 2000)
set  -g focus-events on         # lets Neovim reload a file changed from outside
set  -g allow-passthrough on    # allows images in the terminal (yazi, image.nvim)
set  -g detach-on-destroy off   # closing the last session jumps to another one
set  -g set-titles on           # sets the terminal window title

# Number windows/panes from 1 instead of 0 (the 1 key is the leftmost one)
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on     # renumber when a window closes, leaving no gap

# Do NOT set default-shell — tmux uses your own $SHELL.
# Hard-coding /bin/zsh breaks on a machine whose zsh lives at /usr/bin/zsh.


# ------------------------------------------------------------------------------
# Prefix — KEPT AS THE DEFAULT Ctrl+b
# ------------------------------------------------------------------------------
# Not moved to Ctrl+a, because Ctrl+a is the shell's own "go to start of line".
# To change it anyway, uncomment the three lines below:
#   unbind C-b
#   set -g prefix C-a
#   bind -N "Send a real Ctrl+a" C-a send-prefix
#
# ⛔ Ctrl+Space was tried on 2026-09-09 and reverted the same day. tmux sits
# between the terminal and Neovim, so whatever tmux binds it swallows FIRST and
# passes nothing on -- and nvim-cmp uses <C-Space> to trigger completion by hand
# (autocompletion.lua). Inside tmux that key never reached Neovim at all.
# Gin's call: not acceptable. Do not re-propose it without moving cmp's key first.


# ------------------------------------------------------------------------------
# Splitting panes / new windows — always keep the current directory
# ------------------------------------------------------------------------------
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"


# ------------------------------------------------------------------------------
# Moving between panes
# ------------------------------------------------------------------------------
# Prefix + h/j/k/l used to select a pane. It was the THIRD way to do that -- Alt+hjkl
# and Ctrl+hjkl both already move between panes with no prefix at all -- so the keys
# were given to resizing instead, matching Neovim's Space + h/j/k/l. See §Resizing.

# vim style, NO prefix needed
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Arrow keys, no prefix needed
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R


# ------------------------------------------------------------------------------
# Resizing panes  (-r = hold the prefix and press repeatedly)
# ------------------------------------------------------------------------------
# The same fingers as Neovim: Space + h/j/k/l there, Prefix + h/j/k/l here, 5 cells
# each. Lowercase, so no Shift. These were select-pane until Alt+hjkl and Ctrl+hjkl
# made that binding redundant.
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
# By 1 cell: Prefix + Ctrl+arrow (tmux's own default, kept).
#
# ⛔ The 1-cell key CANNOT match Neovim's. Neovim uses a BARE Ctrl+arrow; if tmux
# bound the bare key too it would swallow it and Neovim would never see it. So tmux
# keeps its prefix on that one, and it is the single place the two differ.
#
# Prefix + Ctrl+h/j/k/l is deliberately not used: Ctrl+h/j/k/l belongs to seamless
# Neovim navigation, and two meanings for one key is very easy to confuse.

# Zoom a pane in / out
bind -r m resize-pane -Z


# ------------------------------------------------------------------------------
# Seamless navigation with Neovim  (vim-tmux-navigator)
# ------------------------------------------------------------------------------
# Ctrl+h/j/k/l jumps to the next box along, with NO distinction between a tmux
# pane and a Neovim window. Both sides are needed for it to work:
#   - Neovim side : the christoomey/vim-tmux-navigator plugin (already in nvim-config)
#   - tmux side   : the lines below
#
# How it works: inspect the process running in the pane. If it is vim/nvim, SEND
# the key on and let it handle it; if not, tmux switches pane itself.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Ctrl+l is normally the shell's "clear the screen", and is now taken for pane
# switching. Give it back through the prefix.
bind C-l send-keys 'C-l'

# The same keys move around inside copy mode too.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R


# ------------------------------------------------------------------------------
# Switching windows
# ------------------------------------------------------------------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left  previous-window
bind -n S-Right next-window

# Move the current window left/right in the list
bind -r C-S-Left  swap-window -d -t -1
bind -r C-S-Right swap-window -d -t +1


# ------------------------------------------------------------------------------
# Reloading the config
# ------------------------------------------------------------------------------
# No hard-coded path: try ~/.config/tmux/tmux.conf first, then ~/.tmux.conf
unbind r
bind r if-shell '[ -f "$HOME/.config/tmux/tmux.conf" ]' \
    'source-file "$HOME/.config/tmux/tmux.conf" ; display "Config reloaded"' \
    'source-file "$HOME/.tmux.conf" ; display "Config reloaded"'


# ------------------------------------------------------------------------------
# vim-style copy mode
# ------------------------------------------------------------------------------
# Enter copy mode: Prefix + [    Leave: q
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle      # rectangular selection
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# Releasing the mouse does NOT leave copy mode (tmux leaves immediately by
# default, losing the selection just made)
unbind -T copy-mode-vi MouseDragEnd1Pane

# Paste
bind P paste-buffer


# ------------------------------------------------------------------------------
# Clipboard — detected per operating system
# ------------------------------------------------------------------------------
# TWO LAYERS RUNNING SIDE BY SIDE, not a choice between them:
#
#   Layer 1 — OSC 52: turned on by `set -g set-clipboard on` in the Basics
#           section. Every time a tmux buffer is written, tmux emits an OSC 52
#           escape sequence to the terminal. This works on every operating
#           system and over SSH, as long as the terminal supports it (WezTerm,
#           kitty, iTerm2, Alacritty, Ghostty and Windows Terminal all do).
#
#   Layer 2 — the native command: the `if-shell` lines below switch the `y` key
#           to `copy-pipe-and-cancel`. That command BOTH writes to the tmux
#           buffer (so layer 1's OSC 52 is STILL sent) AND pipes the content to
#           the operating system's own clipboard command.
#
# If one layer breaks, the other still works.
#
# The order of the lines below matters: a later line overrides the `y` binding
# made by an earlier one, so they run from lowest priority to highest.

# Linux — X11
if-shell 'command -v xclip >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# Linux — Wayland (takes priority over X11)
if-shell 'command -v wl-copy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'

# macOS
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'

# WSL — highest priority, pushes straight to the Windows clipboard
if-shell 'command -v clip.exe >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"'


# ------------------------------------------------------------------------------
# Appearance — Tokyo Night Moon
# ------------------------------------------------------------------------------
# %hidden = a variable only tmux uses, which does NOT leak into the shell
# environment. (Drop %hidden and all 13 of these show up in every shell's `env`.)
# To change the colours: edit the 13 lines below, nothing else.
%hidden thm_bg="#222436"
%hidden thm_fg="#c8d3f5"
%hidden thm_black="#1b1d2b"
%hidden thm_black4="#444a73"
%hidden thm_gray="#3a3f5a"
%hidden thm_red="#ff757f"
%hidden thm_pink="#ff757f"
%hidden thm_green="#c3e88d"
%hidden thm_yellow="#ffc777"
%hidden thm_orange="#ff9e64"
%hidden thm_blue="#82aaff"
%hidden thm_magenta="#c099ff"
%hidden thm_cyan="#86e1fc"

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=${thm_fg},bg=${thm_bg}"

# Messages
set -g message-style         "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Pane borders
set -g pane-border-style        "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Copy mode / clock
set -g mode-style        "fg=${thm_blue},bg=${thm_black4},bold"
set -g clock-mode-colour "${thm_blue}"

set -g window-status-separator ""
set -g window-status-style          "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"

# The CURRENT window: its number + a tick + the last 2 directory levels
#
#   #I  = the window number
#   #{s|...|...|:pane_current_path}  = take the last 2 directory levels by regex
#
#   Example:  /home/you/repos/project/backend/src  ->  backend/src
#
#   NOTE: it must be written \\1 (TWO backslashes). Written \1 with one,
#   tmux reads it as an octal escape and errors with "invalid octal escape".
#
#   This is tmux's NATIVE way, unlike the original which shelled out:
#     #(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev)
#   The shell version spawns 3 processes on every status redraw, and BREAKS if a
#   directory name contains a single quote ('). The regex version has neither problem.
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_magenta}](✓) #[fg=${thm_cyan}]#{s|^.*/([^/]+/[^/]+)$|\\1|:pane_current_path} "

# The OTHER windows: number + program name
set -g window-status-format " #I: #W"

# Left-hand side: empty
set -g status-left ""

# Right-hand side: window name | prefix indicator | session name
# #{?client_prefix,A,B} = show A while the prefix is held, otherwise B
# -> the middle box turns purple the moment you press Ctrl+b
set -g status-right "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_fg},bg=${thm_gray}]  #W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}]  #[fg=${thm_fg},bg=${thm_gray}] #S "


# ------------------------------------------------------------------------------
# Machine-local overrides
# ------------------------------------------------------------------------------
# Anything specific to one machine goes in local.conf, which is not in this repo
# (same convention as ~/.config/zsh/local.zsh). Absent on other machines = no-op.
if-shell '[ -f "$HOME/.config/tmux/local.conf" ]' 'source-file "$HOME/.config/tmux/local.conf"'

# ------------------------------------------------------------------------------
# Session persistence — windows, panes and cwd survive a reboot
# ------------------------------------------------------------------------------
# Plugins are cloned by hand, no TPM. On a new machine:
#   git clone --depth 1 https://github.com/tmux-plugins/tmux-resurrect ~/.config/tmux/plugins/tmux-resurrect
#   git clone --depth 1 https://github.com/tmux-plugins/tmux-continuum ~/.config/tmux/plugins/tmux-continuum
# Not cloned = the two if-shell lines below are a no-op and tmux starts clean.

set -g @resurrect-capture-pane-contents 'on'   # also save what each pane was showing
set -g @continuum-restore 'on'                 # restore on the first tmux after a boot
set -g @continuum-save-interval '5'            # minutes; default 15 loses more on a crash

# Restore only relaunches whitelisted programs; the default list has no `claude`.
# `~` matches any command starting with claude, `->` is what actually gets run.
# --continue reopens that directory's most recent conversation from ~/.claude/projects.
set -g @resurrect-processes '"~claude->claude --continue"'

# These run-shell lines must stay LAST: the plugins read every @option set above.
if-shell '[ -d "$HOME/.config/tmux/plugins/tmux-resurrect" ]' 'run-shell "$HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"'
if-shell '[ -d "$HOME/.config/tmux/plugins/tmux-continuum" ]' 'run-shell "$HOME/.config/tmux/plugins/tmux-continuum/continuum.tmux"'
